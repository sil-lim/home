<div class="poem" style="--d:.65s">마음을 두고 왔다
문 앞
바닥에
그 아무도 없는 집 앞
기다리면서 기다리고
고요하게 느낄 땐
난 살아지고
이 속살 처럼 번지는 여름 공기
나무도 없는 바람
기대면서 저물고
두고 온 마음도
지나간다
소리 없이
꽃살속으로
간다고 한다
돌아온다고했다</div>
