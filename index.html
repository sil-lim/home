<style>
html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
#blk{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:9}
body.off #blk{opacity:1}
.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  width:min(100vw,150vh);
  aspect-ratio:3/2;
}
.grid .c,.dad{animation:fade .3s ease-out var(--d,0s) backwards}
.dad{grid-column:4/5;grid-row:3/5;display:flex;align-items:center;justify-content:center;min-height:0}
.grid .dad img{width:82%;height:auto;object-fit:contain}
.grid img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s ease}
.grid img.gone,.poem.gone{opacity:0}
@keyframes fade{from{opacity:0}}
.poem{transition:opacity .6s ease}
.poem span{opacity:0}
.poem{
  grid-column:3/5;
  grid-row:3/5;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:6%;
  box-sizing:border-box;
  text-align:left;
  font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
  font-weight:400;
  color:#111;
  font-size:calc(min(100vw,150vh)*.0058);
  line-height:1.9;
  white-space:pre-line;
  min-height:0;
  overflow:hidden;
}
</style>
</head><body>
<div class="grid">
<div class="c" style="--d:0s"><img src="jeju/01-GS008909.jpg" alt=""></div><div class="c" style="--d:.055s"><img src="jeju/02-GS008897.jpg" alt=""></div><div class="c" style="--d:.11s"><img src="jeju/03-GS008896.jpg" alt=""></div><div class="c" style="--d:.165s"><img src="jeju/04-GS008815.jpg" alt=""></div><div class="c" style="--d:.22s"><img src="jeju/05-GS008795.jpg" alt=""></div><div class="c" style="--d:.275s"><img src="jeju/06-GS008802.jpg" alt=""></div>
<div class="c" style="--d:.055s"><img src="jeju/07-GS008874.jpg" alt=""></div><div class="c" style="--d:.11s"><img src="jeju/08-GS008996.jpg" alt=""></div><div class="c" style="--d:.165s"><img src="jeju/09-GS008819.jpg" alt=""></div><div class="c" style="--d:.22s"><img src="jeju/10-GS008850.jpg" alt=""></div><div class="c" style="--d:.275s"><img src="jeju/11-GS008830.jpg" alt=""></div><div class="c" style="--d:.33s"><img src="jeju/12-GS008827.jpg" alt=""></div>
<div class="poem">마음을 두고 왔다
문 앞
바닥에
그 아무도 없는 집 앞
기다리면서 기다리고
고요하게 느낄 땐
난 살아지고
이 속살 처럼 번지는 여름 공기
나무도 없는 바람
기대면서 저물고
두고 온 마음도
지나간다
소리 없이
꽃살속으로
간다고 한다
돌아온다고했다</div>

<div class="c" style="--d:.495s"><img src="jeju/31-GS009008.jpg" alt=""></div><div class="c" style="--d:.55s"><img src="jeju/32-GS009022.jpg" alt=""></div>
</div>

<script>
(function(){
document.addEventListener('click',function(){document.body.classList.add('off')});
var hv=document.querySelectorAll('.grid img,.poem'),h;
for(h=0;h<hv.length;h++)hv[h].addEventListener('mouseenter',function(){this.classList.add('gone')});
document.addEventListener('keydown',function(){document.body.classList.add('off')});
var p=document.querySelector('.poem'),t=p.textContent,w=document.createElement('div'),sp=[],i,c,s;
p.textContent='';
for(i=0;i<t.length;i++){
c=t.charAt(i);
if(c==='\n'||c===' '){w.appendChild(document.createTextNode(c));continue}
s=document.createElement('span');s.textContent=c;w.appendChild(s);sp.push(s);
}
p.appendChild(w);
setTimeout(function(){
var k=0,iv=setInterval(function(){
sp[k].style.opacity='1';
if(++k>=sp.length)clearInterval(iv);
},15);
},650);
})();
</script>
